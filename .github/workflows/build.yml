name: Build widget

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build widget
              run: npm run build

            - name: Upload .mpk artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ConnectivityChecker-mpk
                  path: dist/**/*.mpk
                  if-no-files-found: error

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/**/*.mpk
                  generate_release_notes: true
